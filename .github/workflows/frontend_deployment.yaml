name: frontend deployment

on:
  workflow_dispatch:
    inputs:
      isAnimationEnabled:
        description: 'spline animation is enabled '
        required: false
        type: boolean
        default: false
      isChatbotEnabled:
        description: 'chatbot is enabled'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - prod
    paths-ignore:
      - 'dist/**'
      - 'docs/**'
      - 'backend/**'

jobs:
  build:
    env:
      CI_COMMIT_MESSAGE: updates CI/CD Build Artifacts
      CI_COMMIT_AUTHOR: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: 🌿 Check out branch
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: 💽 Install dependencies
        run: |
          npm ci

      - name: 🏁 Update feature flag environment variables
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ANIMATION_ENABLED="${{ github.event.inputs.isAnimationEnabled }}"
            CHATBOT_ENABLED="${{ github.event.inputs.isChatbotEnabled }}"
          else
            ANIMATION_ENABLED="${{ vars.FEATURE_FLAG_ANIMATION_ENABLED }}"
            CHATBOT_ENABLED="${{ vars.FEATURE_FLAG_CHATBOT_ENABLED }}"
          fi

          echo "Setting featureFlag_animationEnabled to $ANIMATION_ENABLED"
          echo "Setting featureFlag_chatbotEnabled to $CHATBOT_ENABLED"
          sed -i "s/\"FEATURE_FLAG_ANIMATION_ENABLED\"/$ANIMATION_ENABLED/g" ./src/environments/environment.prod.ts
          sed -i "s/\"FEATURE_FLAG_CHATBOT_ENABLED\"/$CHATBOT_ENABLED/g" ./src/environments/environment.prod.ts

      - name: 🚧 Build project for production
        run: |
          rm -r ./docs
          npm run build-prod
          cp -r "./dist/portfolio/browser/" "./docs"
          cp "./docs/index.html" "./docs/404.html"
          cp "./src/robots.txt" "./docs/robots.txt"
          cp "./src/sitemap.xml" "./docs/sitemap.xml"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "FeatureFlag featureFlag_animationEnabled updated to ${{ github.event.inputs.isAnimationEnabled }}" >> ./docs/workflow_dispatch.txt
            echo "FeatureFlag featureFlag_chatbotEnabled updated to ${{ github.event.inputs.isChatbotEnabled }}" >> ./docs/workflow_dispatch.txt
          fi

      - name: 🎉 Commit & Push
        run: |
          git add docs/
          git stash push -- docs
          git restore .

          git fetch origin gh-pages
          git checkout gh-pages

          git rm -rf . 2>/dev/null || true
          git clean -fd

          git stash pop
          git add docs/

          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "username@users.noreply.github.com"
          git commit -a -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push -f
