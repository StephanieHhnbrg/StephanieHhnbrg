<div class="container" *ngIf="data">
  <h2>{{"TITLE.TALKS" | translate}}</h2>

  <div class="sessions" *ngIf="data && data.sessions && data.sessions.length > 0">
    <h3>{{"TITLE.SESSIONS" | translate}}</h3>
    <ng-container *ngFor="let talk of data.sessions">
      <div class="row">
        <button class="list-icon" mat-icon-button disabled>
          <mat-icon>co_present</mat-icon>
        </button>
        <div class="content">
        <p>{{talk.title}}</p>
        <small>{{talk.description}}
          <a mat-button color="primary" [href]="talk.sessionUrl" target="_blank">{{"BUTTON.VIEW_SESSION" | translate}}</a></small>
        </div>
      </div>
      <mat-divider></mat-divider>
    </ng-container>

  </div>

  <div class="events" *ngIf="data && data.events && data.events.length > 0">
    <h3>{{"TITLE.EVENTS" | translate}}</h3>
    <ng-container *ngFor="let event of data.events">
      <div class="row">
        <button class="list-icon" mat-icon-button disabled>
          <mat-icon>event</mat-icon>
        </button>
        <div class="content">
          <p>
            <a class="event-title" [href]="event.website" target="_blank">{{event.name}}</a>&nbsp;
            <span class="chip" *ngIf="isUpcomingEvent(event.eventStartDate)">{{"TALKS.UPCOMING" | translate}}</span>

          </p>
          <small>{{event.eventStartDate | monthYear }} | {{event.location}}</small>
        </div>
      </div>
      <mat-divider></mat-divider>
    </ng-container>
  </div>
</div>
