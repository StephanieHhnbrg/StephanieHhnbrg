<div class="container">
  <h2>{{"TITLE.ARTICLES" | translate}}</h2>
  <mat-card *ngFor="let article of articles" appearance="outlined">
    <mat-card-header>
      <div mat-card-avatar class="thumb-nail" [style.background-image]="'url(' + article.thumbNail + ')'"></div>
      <mat-card-title>{{article.title}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-chip-set>
        <mat-chip *ngFor="let topic of article.topics">{{topic}}</mat-chip>
      </mat-chip-set>
      <div class="card-body">
        <img mat-card-image class="banner-image" [src]="article.imageLink">
        <div>
          <span class="article-desc">{{article.description}}</span>
          <a mat-button color="primary" [href]="article.link" target="_blank">{{"BUTTON.READ_MORE" | translate}}</a>
        </div>

      </div>


    </mat-card-content>
  </mat-card>

</div>
